name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web build + sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Keystore
        env:
          NOMAD_KEYSTORE_BASE64: ${{ secrets.NOMAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NOMAD_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NOMAD_KEYSTORE_BASE64 manquant : l'APK doit être signé avec la clé de release."
            exit 1
          fi
          echo "$NOMAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nomad.keystore"
          echo "NOMAD_KEYSTORE_FILE=$RUNNER_TEMP/nomad.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          NOMAD_KEYSTORE_PASSWORD: ${{ secrets.NOMAD_KEYSTORE_PASSWORD }}
          NOMAD_KEY_ALIAS: ${{ secrets.NOMAD_KEY_ALIAS }}
          NOMAD_KEY_PASSWORD: ${{ secrets.NOMAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Nomad-v$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Nomad-v${{ env.VERSION }}
          path: dist/*.apk
          if-no-files-found: error
