plugins { id 'com.android.application' }

android {
    namespace 'com.nomad.ioskeyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nomad.ioskeyboard'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'ioskeyboard'
            keyAlias 'key'
            keyPassword 'ioskeyboard'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'txt' }
    lint { checkReleaseBuilds false; abortOnError false }
}
